    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Garland Background Pattern */
    .garland-pattern {
      background-color: #064e3b;
      background-image: radial-gradient(#10b981 1.5px, transparent 1.5px), radial-gradient(#ef4444 1.5px, transparent 1.5px);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
    }

    /* Festive Movement Animations */
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.35; transform: scale(0.85) rotate(-8deg); filter: drop-shadow(0 0 1px gold); }
      50% { opacity: 1; transform: scale(1.35) rotate(16deg); filter: drop-shadow(0 0 7px #fde047); }
    }
    @keyframes starTwinkleAlt {
      0%, 100% { opacity: 1; transform: scale(1.25) rotate(14deg); filter: drop-shadow(0 0 6px #facc15); }
      50% { opacity: 0.3; transform: scale(0.8) rotate(-12deg); filter: drop-shadow(0 0 1px #ca8a04); }
    }
    @keyframes treeGrowPulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.18, 1.25) rotate(-3deg); }
      50% { transform: scale(1.28, 1.38) rotate(2deg); filter: drop-shadow(0 0 8px #34d399); }
      75% { transform: scale(1.12, 1.18) rotate(-1deg); }
    }
    @keyframes garlandShimmer {
      0%, 100% { filter: drop-shadow(0 0 2px #059669); }
      50% { filter: drop-shadow(0 0 8px #10b981) drop-shadow(0 0 10px #f43f5e); }
    }

    .animate-twinkle { display: inline-block; animation: starTwinkle 1.6s ease-in-out infinite; }
    .animate-twinkle-alt { display: inline-block; animation: starTwinkleAlt 2.1s ease-in-out infinite; }
    .animate-tree-grow { display: inline-block; transform-origin: bottom center; animation: treeGrowPulse 2.6s ease-in-out infinite; }
    .animate-garland-shimmer { animation: garlandShimmer 3s ease-in-out infinite; }

    /* Gift Box Tool Picker (Holiday Showdown) */
    .gift-btn { transition: background-color 0.15s ease, box-shadow 0.15s ease; }
    .gift {
      position: relative;
      display: block;
      width: 100%;
      max-width: 84px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      transition: transform 0.2s ease;
    }
    .gift-btn:hover .gift { transform: translateY(-3px); }
    .gift-box {
      position: absolute;
      left: 8%; right: 8%; top: 34%; bottom: 0;
      border-radius: 6px;
      box-shadow: inset 0 -6px 0 rgba(0,0,0,0.12);
      overflow: hidden;
    }
    .gift-lid {
      position: absolute;
      left: 2%; right: 2%; top: 20%; height: 18%;
      border-radius: 5px;
      box-shadow: 0 3px 0 rgba(0,0,0,0.15);
      transform-origin: 10% 100%;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
      z-index: 2;
    }
    .gift-ribbon {
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 16%;
      transform: translateX(-50%);
    }
    .gift-ribbon-h {
      position: absolute;
      top: 38%; left: 0; right: 0;
      height: 14%;
    }
    .gift-bow {
      position: absolute;
      left: 50%; bottom: 70%;
      transform: translateX(-50%);
      font-size: 1.6rem;
      line-height: 1;
    }
    .gift-sparkle {
      position: absolute;
      left: 50%; top: 22%;
      transform: translateX(-50%) scale(0.4);
      opacity: 0;
      font-size: 1.3rem;
      transition: opacity 0.25s ease 0.1s, transform 0.3s ease 0.1s;
      z-index: 1;
    }
    .gift.is-open .gift-lid { transform: translate(-6px, -16px) rotate(-18deg); }
    .gift.is-open .gift-sparkle { opacity: 1; transform: translateX(-50%) scale(1); }
    @keyframes tagUnwrap {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .tag-unwrap { animation: tagUnwrap 0.18s ease-out; }

    /* 5E ornament: a short gold string above each tag */
    .ornament { position: relative; margin-top: 6px; }
    .ornament::before {
      content: '';
      position: absolute;
      left: 50%; top: -7px;
      width: 2px; height: 6px;
      background: #b45309;
      transform: translateX(-50%);
    }

    /* Visible keyboard focus */
    button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-twinkle, .animate-twinkle-alt, .animate-tree-grow, .animate-garland-shimmer, .tag-unwrap {
        animation: none !important;
      }
      .gift, .gift-lid, .gift-sparkle { transition: none !important; }
    }

    /* Print & Desk Reference Styling */
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area {
        position: absolute; left: 0; top: 0; width: 100%; display: block !important;
        background: white !important; color: #0f172a !important; padding: 0.5in;
      }
      .no-print { display: none !important; }
    }

      { key: 'm1', modId: 1, short: 'Module 1', label: 'Module 1 - Engagement & Learning', activity: 'Module 1 reflection' },
      { key: 'm2', modId: 2, short: 'Module 2', label: 'Module 2 - Collaborative Tech & Group Work', activity: 'Module 2 reflection' },
      { key: 'm3', modId: 3, short: 'Module 3', label: 'Module 3 - Games: Online or on the Table?', activity: 'Module 3 reflection' },
      { key: 'm4', modId: 4, short: 'Module 4', label: 'Module 4 - Reflection on Classroom Tech', activity: 'Module 4 reflection' },
      { key: 'final', modId: null, short: 'Final Reflection', label: 'Final Reflection (Capstone)', activity: 'integration artifact' }
    ];
    const EMPTY_LOGS = { m1: [], m2: [], m3: [], m4: [], final: [] };

    const TIME_OPTIONS = (() => {
      const out = [];
      for (let m = 5 * 60; m <= 23 * 60 + 30; m += 30) {
        out.push(`${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`);
      }
      return out;
    })();
    const toMin = (t) => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
    const fmtTime = (t) => { let [h, m] = String(t).split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${ap}`; };
    const fmtDate = (d) => { if (!d) return ''; const [y, mo, da] = d.split('-').map(Number); return new Date(y, mo - 1, da).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
    const entryHours = (e) => Math.max(0, (toMin(e.end) - toMin(e.start)) / 60);
    const totalHours = (entries) => (entries || []).reduce((sum, e) => sum + entryHours(e), 0);
    const fmtHours = (h) => (Number.isInteger(h) ? String(h) : h.toFixed(1));
    const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
    const courseClosed = () => todayISO() > COURSE_CONFIG.endDate;

    function TimeLogCard({ item, entries, allLogs, onChange, activityDone }) {
      const [date, setDate] = useState('');
      const [start, setStart] = useState('');
      const [end, setEnd] = useState('');
      const [err, setErr] = useState('');
      const list = entries || [];
      const hours = totalHours(list);
      const pct = Math.min(100, Math.round((hours / COURSE_CONFIG.hoursPerItem) * 100));
      const today = todayISO();
      const maxDate = today < COURSE_CONFIG.endDate ? today : COURSE_CONFIG.endDate;

      const add = () => {
        if (!date) { setErr('Choose the date you worked.'); return; }
        if (date < COURSE_CONFIG.startDate || date > COURSE_CONFIG.endDate) { setErr(`Please choose a date during the course (${fmtDate(COURSE_CONFIG.startDate)} to ${fmtDate(COURSE_CONFIG.endDate)}).`); return; }
        if (date > today) { setErr("You can't log time for a future date."); return; }
        if (!start || !end) { setErr('Choose a start time and an end time.'); return; }
        if (toMin(end) <= toMin(start)) { setErr('The end time needs to be after the start time.'); return; }
        for (const it of SCECH_ITEMS) {
          for (const e of (allLogs[it.key] || [])) {
            if (e.date === date && toMin(start) < toMin(e.end) && toMin(e.start) < toMin(end)) {
              setErr(`That time overlaps with time you already logged for ${it.short}.`);
              return;
            }
          }
        }
        const next = [...list, { id: Date.now().toString(36), date, start, end }]
          .sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
        onChange(next);
        setStart('');
        setEnd('');
        setErr('');
      };

      return (
        <section className="bg-white rounded-2xl p-5 border-2 border-emerald-700 shadow-sm space-y-4">
          <div className="flex items-start justify-between gap-3 flex-wrap">
            <div>
              <h3 className="text-base font-black text-slate-900">⏱️ {item.short} Time Log</h3>
              <p className="text-xs text-slate-800 font-medium mt-0.5 max-w-xl">
                Log the dates and times you spent on this part of the course, including reading, activities, and trying ideas with students. Use half-hour increments. {COURSE_CONFIG.hoursPerItem} hour counts toward your SCECH.
              </p>
            </div>
            <div className="text-right min-w-[8rem]">
              <div className="text-sm font-black text-slate-900">{fmtHours(hours)} of {COURSE_CONFIG.hoursPerItem} hr</div>
              <div className="w-32 h-2.5 bg-slate-200 rounded-full overflow-hidden mt-1 ml-auto" role="progressbar" aria-valuenow={pct} aria-valuemin={0} aria-valuemax={100} aria-label={`${item.short} hours logged`}>
                <div className="h-full bg-emerald-700 rounded-full transition-all" style={{ width: `${pct}%` }}></div>
              </div>
            </div>
          </div>

          {list.length > 0 && (
            <ul className="divide-y divide-slate-200 border border-slate-200 rounded-xl">
              {list.map(e => (
                <li key={e.id} className="flex items-center justify-between gap-3 px-3 py-2 text-xs text-slate-900">
                  <span><strong>{fmtDate(e.date)}</strong> • {fmtTime(e.start)}–{fmtTime(e.end)}</span>
                  <span className="flex items-center gap-3">
                    <span className="font-black">{fmtHours(entryHours(e))} hr</span>
                    <button
                      type="button"
                      onClick={() => onChange(list.filter(x => x.id !== e.id))}
                      className="text-red-800 hover:text-red-950 font-black underline"
                      aria-label={`Remove ${fmtDate(e.date)} entry`}
                    >
                      Remove
                    </button>
                  </span>
                </li>
              ))}
            </ul>
          )}

          <div className="grid grid-cols-1 sm:grid-cols-4 gap-2 items-end">
            <div>
              <label htmlFor={`log-date-${item.key}`} className="block text-[11px] font-black text-slate-900 mb-1">Date</label>
              <input id={`log-date-${item.key}`} type="date" min={COURSE_CONFIG.startDate} max={maxDate} value={date} onChange={(e) => setDate(e.target.value)}
                className="w-full p-2 rounded-lg border-2 border-slate-300 text-xs focus:border-emerald-600 focus:outline-none" />
            </div>
            <div>
              <label htmlFor={`log-start-${item.key}`} className="block text-[11px] font-black text-slate-900 mb-1">Start</label>
              <select id={`log-start-${item.key}`} value={start} onChange={(e) => setStart(e.target.value)}
                className="w-full p-2 rounded-lg border-2 border-slate-300 text-xs bg-white focus:border-emerald-600 focus:outline-none">
                <option value="">Start time</option>
                {TIME_OPTIONS.map(t => <option key={t} value={t}>{fmtTime(t)}</option>)}
              </select>
            </div>
            <div>
              <label htmlFor={`log-end-${item.key}`} className="block text-[11px] font-black text-slate-900 mb-1">End</label>
              <select id={`log-end-${item.key}`} value={end} onChange={(e) => setEnd(e.target.value)}
                className="w-full p-2 rounded-lg border-2 border-slate-300 text-xs bg-white focus:border-emerald-600 focus:outline-none">
                <option value="">End time</option>
                {TIME_OPTIONS.map(t => <option key={t} value={t}>{fmtTime(t)}</option>)}
              </select>
            </div>
            <button type="button" onClick={add} className="p-2.5 rounded-lg bg-emerald-800 hover:bg-emerald-900 text-white text-xs font-black">
              Add time
            </button>
          </div>
          {err && <p className="text-xs font-bold text-red-800" role="alert">{err}</p>}

          <div className={`rounded-xl p-3 text-xs font-bold ${hours >= COURSE_CONFIG.hoursPerItem && activityDone ? 'bg-emerald-50 border border-emerald-400 text-emerald-950' : 'bg-slate-50 border border-slate-300 text-slate-900'}`} role="status">
            {hours >= COURSE_CONFIG.hoursPerItem && activityDone
              ? `✅ SCECH earned for ${item.short}!`
              : hours >= COURSE_CONFIG.hoursPerItem
                ? `Your hour is logged. Finish your ${item.activity} to earn this SCECH.`
                : `${fmtHours(COURSE_CONFIG.hoursPerItem - hours)} more hour${COURSE_CONFIG.hoursPerItem - hours === 1 ? '' : 's'} to go${activityDone ? '. Your activity is already done!' : ` (plus your ${item.activity}).`}`}
          </div>
          {hours > COURSE_CONFIG.hoursPerItem && (
            <p className="text-xs font-bold text-amber-950 bg-amber-50 border border-amber-300 rounded-xl p-3">
              🎉 Great work! You've logged {fmtHours(hours)} hours here. Please note that {COURSE_CONFIG.hoursPerItem} hour per module counts toward SCECHs, with a {COURSE_CONFIG.maxScech} SCECH maximum for this course.
            </p>
          )}
        </section>
      );
    }

    // Printable copy of the state time log, one page per teacher (facilitator use)
    function TimeLogSheets({ subs }) {
      return (
        <div>
          {subs.map((sub, i) => {
            const logs = sub.timeLog || {};
            const creditedTotal = SCECH_ITEMS.reduce((sum, it) => sum + (sub.scech && sub.scech[it.key] ? COURSE_CONFIG.hoursPerItem : 0), 0);
            return (
              <div key={sub.uid || i} style={{ pageBreakAfter: i < subs.length - 1 ? 'always' : 'auto' }} className="text-slate-900 mb-8">
                <h1 className="text-xl font-black">{COURSE_CONFIG.title}</h1>
                <div className="text-xs font-bold">Agenda/Time Log • Instructor: {COURSE_CONFIG.instructor} • {COURSE_CONFIG.datesLabel}</div>
                <p className="text-[11px] mt-2 leading-snug">
                  This log sheet documents the dates and hours spent working on course material, including readings, participation in collaborative events, time spent completing course activities, and the application of the course content. Time spent must be equal to or greater than the minimum time for each module to receive the SCECH for that module.
                </p>
                <table className="w-full text-xs mt-3 border-collapse">
                  <tbody>
                    <tr>
                      <td className="border border-slate-500 p-1.5"><strong>Name:</strong> {sub.participantName}</td>
                      <td className="border border-slate-500 p-1.5"><strong>Course Start Date:</strong> {fmtDate(sub.courseStartDate) || '—'}</td>
                    </tr>
                    <tr>
                      <td className="border border-slate-500 p-1.5"><strong>PIC Number:</strong> {sub.picNumber}</td>
                      <td className="border border-slate-500 p-1.5"><strong>Completion Date:</strong> {fmtDate(sub.completionDate) || '—'}</td>
                    </tr>
                  </tbody>
                </table>
                <table className="w-full text-[11px] mt-3 border-collapse">
                  <thead>
                    <tr className="bg-slate-100">
                      <th className="border border-slate-500 p-1.5 text-left">Module</th>
                      <th className="border border-slate-500 p-1.5 text-left">Allowed Time</th>
                      <th className="border border-slate-500 p-1.5 text-left">Date &amp; Times Worked</th>
                      <th className="border border-slate-500 p-1.5 text-left">Total Hours</th>
                    </tr>
                  </thead>
                  <tbody>
                    {SCECH_ITEMS.map(it => {
                      const entries = logs[it.key] || [];
                      const logged = totalHours(entries);
                      const credited = sub.scech && sub.scech[it.key] ? COURSE_CONFIG.hoursPerItem : 0;
                      return (
                        <tr key={it.key}>
                          <td className="border border-slate-500 p-1.5 font-bold">{it.label}</td>
                          <td className="border border-slate-500 p-1.5">{COURSE_CONFIG.hoursPerItem} hr</td>
                          <td className="border border-slate-500 p-1.5">
                            {entries.length === 0 ? '—' : entries.map((e, k) => (
                              <div key={k}>{fmtDate(e.date)}: {fmtTime(e.start)}–{fmtTime(e.end)}</div>
                            ))}
                          </td>
                          <td className="border border-slate-500 p-1.5">
                            {fmtHours(credited)} hr credited
                            {logged !== credited && <div className="text-[10px]">({fmtHours(logged)} hr logged)</div>}
                          </td>
                        </tr>
                      );
                    })}
                    <tr className="bg-slate-100 font-black">
                      <td className="border border-slate-500 p-1.5" colSpan={3}>Totals (1–{COURSE_CONFIG.maxScech} hrs)</td>
                      <td className="border border-slate-500 p-1.5">{fmtHours(creditedTotal)} hr = {creditedTotal} SCECH{creditedTotal === 1 ? '' : 's'}</td>
                    </tr>
                  </tbody>
                </table>
                <p className="text-[11px] mt-3 leading-snug">
                  By adding my name below and submitting this form electronically through the course site, I certify that all the information documented on this form is accurate.
                </p>
                <p className="text-xs mt-1">
                  <strong>Electronically signed:</strong> {(sub.certification && sub.certification.signedName) || '—'} • {formatWhen(sub.submittedAt, sub.dateString)}
                </p>
                <p className="text-[10px] mt-1">Verification code {sub.verificationCode} • Facilitator status: {sub.status === 'Submitted' ? 'Awaiting Review' : sub.status}</p>
              </div>
            );
          })}
        </div>
      );
    }

    // --- PHASE 3 HELPERS: release switches + facilitator progress view ---
    const reflectionDone = (r) => {
      if (!r) return false;
      if (typeof r === 'string') return r.trim().length > 0;
      const hasDigital = r.digital === 'Other' ? Boolean(r.digitalCustom && r.digitalCustom.trim()) : Boolean(r.digital && r.digital.trim());
      const hasAnalog = r.analog === 'Other' ? Boolean(r.analogCustom && r.analogCustom.trim()) : Boolean(r.analog && r.analog.trim());
      return (hasDigital || hasAnalog) && Boolean(r.why && r.why.trim());
    };
    const capstoneDoneFor = (d) => {
      if (!d) return false;
      if (d.submissionType === 'lessonPlan') return Boolean((d.lessonTitle || '').trim() && (d.lessonIntegrationPlan || '').trim());
      return /^https?:\/\/\S+$/i.test((d.artifactUrl || '').trim());
    };
    const tsToDate = (ts) => (ts && typeof ts.toDate === 'function' ? ts.toDate() : null);
    const daysSince = (date) => (date ? Math.floor((Date.now() - date.getTime()) / 86400000) : null);
    const activityKeyFor = (itemKey) => (itemKey === 'final' ? 'capstone' : itemKey);

    const summarizeUser = (u) => {
      const notes = u.notes || {};
      const logs = u.timeLogs || {};
      const act = u.activity || {};
      const items = SCECH_ITEMS.map(it => {
        const hours = totalHours(logs[it.key]);
        const done = it.modId ? reflectionDone(notes[it.modId]) : capstoneDoneFor(u.capstoneDraft);
        const a = act[activityKeyFor(it.key)] || {};
        const minutes = a.minutes || 0;
        const started = done || hours > 0 || minutes > 0 || (a.stepsSeen || []).length > 0;
        return { ...it, hours, done, minutes, stepsSeen: a.stepsSeen || [], earned: done && hours >= COURSE_CONFIG.hoursPerItem, started };
      });
      const lastActive = tsToDate(act.lastActive) || tsToDate(u.updatedAt);
      return {
        uid: u.uid,
        name: (u.participantInfo && u.participantInfo.name) || '',
        email: u.email || (u.participantInfo && u.participantInfo.email) || '',
        district: (u.participantInfo && u.participantInfo.district) || '',
        items,
        scech: Math.min(COURSE_CONFIG.maxScech, items.filter(x => x.earned).length),
        totalMinutes: items.reduce((s, x) => s + x.minutes, 0) + ((act.welcome && act.welcome.minutes) || 0),
        lastActive,
        unwraps: act.unwraps || {},
        favorites: u.favorites || [],
        notes,
        logs,
        raw: u
      };
    };

    function LockedGift({ title, onBack }) {
      return (
        <div className="max-w-xl mx-auto bg-white rounded-3xl p-8 text-center border-2 border-amber-400 shadow-sm">
          <div className="text-6xl mb-3" aria-hidden="true">🎁</div>
          <h2 className="text-xl font-black text-slate-900">{title} unwraps soon!</h2>
          <p className="text-sm text-slate-800 font-medium mt-2">
            Your facilitator will open this part of the course on schedule. In the meantime, keep working on the modules that are already open.
          </p>
          <button
            type="button"
            onClick={onBack}
            className="mt-5 px-5 py-2.5 rounded-xl bg-emerald-800 hover:bg-emerald-900 text-white text-sm font-black"
          >
            Back to Start Here
          </button>
        </div>
      );
    }

    function ReleaseSwitch({ label, sub, on, onToggle }) {
      return (
        <div className="flex items-center justify-between gap-4 p-4 rounded-2xl border-2 border-slate-200 bg-white">
          <div>
            <div className="text-sm font-black text-slate-900">{label}</div>
            {sub && <div className="text-xs text-slate-800 font-medium">{sub}</div>}
          </div>
          <button
            type="button"
            role="switch"
            aria-checked={on}
            aria-label={`${label}: ${on ? 'open to teachers' : 'hidden from teachers'}`}
            onClick={onToggle}
            className={`relative inline-flex items-center h-8 w-36 rounded-full border-2 text-[11px] font-black transition-colors shrink-0 ${
              on ? 'bg-emerald-700 border-emerald-800 text-white' : 'bg-slate-200 border-slate-400 text-slate-800'
            }`}
          >
            <span className={`absolute top-0.5 w-6 h-6 rounded-full bg-white shadow transition-all ${on ? 'left-[calc(100%-1.75rem)]' : 'left-0.5'}`}></span>
            <span className={`w-full ${on ? 'pr-7 pl-2 text-left' : 'pl-7 pr-2 text-right'}`}>{on ? 'Open' : 'Hidden'}</span>
          </button>
        </div>
      );
    }

    // --- SUBMISSION HELPERS ---
    const formatWhen = (ts, fallback) => {
      try {
        if (ts && typeof ts.toDate === 'function') {
          return ts.toDate().toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
        }
      } catch (e) {}
      return fallback || 'Just now';
    };

    function StatusPill({ status }) {
      const map = {
        'Submitted': 'bg-amber-100 text-amber-950 border-amber-400',
        'Needs Revision': 'bg-red-100 text-red-900 border-red-400',
        'Verified': 'bg-emerald-100 text-emerald-900 border-emerald-500'
      };
      const label = status === 'Submitted' ? 'Awaiting Review' : (status || 'Unknown');
      return <span className={`inline-block px-2.5 py-1 rounded-full border text-[11px] font-black ${map[status] || 'bg-slate-100 text-slate-800 border-slate-300'}`}>{label}</span>;
    }

    // --- 5E PHASE ORNAMENTS ---
    const PHASE_INFO = {
      Engage: { cls: 'bg-yellow-300 text-yellow-950 border-yellow-600', desc: 'Spark curiosity and surface what students already think.' },
      Explore: { cls: 'bg-sky-600 text-white border-sky-800', desc: 'Students investigate before you explain.' },
      Explain: { cls: 'bg-violet-600 text-white border-violet-800', desc: 'Students put ideas into words, and you add the vocabulary.' },
      Elaborate: { cls: 'bg-orange-600 text-white border-orange-800', desc: 'Students apply learning to a new situation.' },
      Evaluate: { cls: 'bg-slate-800 text-white border-slate-950', desc: 'Students and teachers check understanding.' }
    };
    const PHASE_ORDER = ['Engage', 'Explore', 'Explain', 'Elaborate', 'Evaluate'];

    function PhaseOrnament({ phase }) {
      const info = PHASE_INFO[phase];
      if (!info) return null;
      return (
        <span className={`ornament inline-flex items-center px-1.5 py-0.5 rounded-full border text-[9px] font-black uppercase tracking-wide ${info.cls}`}>
          {phase}
        </span>
      );
    }

    // 5E label for each recipe step (Preheat / Mix / Assemble / Enjoy keep their holiday names)
    const recipePhases = {
      1: { k2: ['Engage', 'Explore', 'Explain'], g38: ['Engage', 'Explore', 'Explain', 'Elaborate'], h912: ['Engage', 'Explore', 'Explain'] },
      2: { k2: ['Engage', 'Elaborate', 'Evaluate'], g38: ['Explore', 'Explain', 'Evaluate'], h912: ['Engage', 'Explore', 'Evaluate'] },
      3: { k2: ['Engage', 'Explore', 'Explain'], g38: ['Engage', 'Explore', 'Explain'], h912: ['Explore', 'Elaborate', 'Evaluate'] },
      4: { k2: ['Engage', 'Explore', 'Explain'], g38: ['Engage', 'Explore', 'Explain', 'Evaluate'], h912: ['Engage', 'Explore', 'Explain', 'Evaluate'] }
    };

    // --- GIFT BOX TOOL PICKER (two matched gifts + an optional stocking stuffer) ---
    function GiftTagTray({ side, gifts, stuffers, favoriteTools, onToggleFavorite, gradeLabel, plannedTool, onPlan, show5E, onUnwrap }) {
      const [openName, setOpenName] = useState(null);
      const isThis = side === 'this';
      const palette = isThis
        ? {
            heading: 'text-rose-900',
            box: 'bg-rose-600',
            lid: 'bg-rose-700',
            ribbon: 'bg-amber-300',
            need: 'text-rose-800',
            btnOpen: 'bg-rose-50 ring-2 ring-rose-500',
            stuffer: 'border-dashed border-rose-400 bg-white text-rose-950 hover:bg-rose-50',
            stufferOpen: 'border-solid border-rose-700 bg-rose-700 text-white',
            panel: 'border-rose-300 bg-rose-50',
            badge: 'text-rose-800',
            openBtn: 'bg-rose-700 hover:bg-rose-800 text-white',
            videoBtn: 'bg-white hover:bg-rose-100 text-rose-900 border-2 border-rose-300'
          }
        : {
            heading: 'text-emerald-900',
            box: 'bg-emerald-700',
            lid: 'bg-emerald-800',
            ribbon: 'bg-red-500',
            need: 'text-emerald-800',
            btnOpen: 'bg-emerald-50 ring-2 ring-emerald-600',
            stuffer: 'border-dashed border-emerald-500 bg-white text-emerald-950 hover:bg-emerald-50',
            stufferOpen: 'border-solid border-emerald-800 bg-emerald-800 text-white',
            panel: 'border-emerald-300 bg-emerald-50',
            badge: 'text-emerald-800',
            openBtn: 'bg-emerald-800 hover:bg-emerald-900 text-white',
            videoBtn: 'bg-white hover:bg-emerald-100 text-emerald-900 border-2 border-emerald-300'
          };

      const all = [...gifts, ...stuffers];
      if (all.length === 0) {
        return <p className="text-xs text-slate-700">No featured {isThis ? 'tools' : 'strategies'} for this grade band yet.</p>;
      }

      const openTool = all.find(t => t.name === openName) || null;
      const toggle = (name) => {
        if (openName !== name && onUnwrap) onUnwrap(name);
        setOpenName(openName === name ? null : name);
      };
      const panelId = `gift-panel-${side}`;
      const openIsFav = openTool ? favoriteTools.includes(openTool.name) : false;
      const openIsTeen = openTool ? (openTool.badge || '').includes('13+') : false;
      const openInPlan = openTool ? plannedTool === openTool.name : false;
      const shortName = (name) => name.replace(/\s*\([^)]*\)\s*$/, '');

      return (
        <div>
          <div className="flex items-center justify-between gap-2 mb-3">
            <span className={`text-[11px] font-black uppercase tracking-wider ${palette.heading}`}>
              🎁 Pick a {isThis ? 'Tool' : 'Strategy'} ({gradeLabel})
            </span>
            <span className="text-[10px] font-bold text-slate-700">Click a gift to unwrap</span>
          </div>

          <div className="grid gap-2" style={{ gridTemplateColumns: `repeat(${Math.max(gifts.length, 1)}, minmax(0, 1fr))` }}>
            {gifts.map((tool) => {
              const isOpen = openName === tool.name;
              const isFav = favoriteTools.includes(tool.name);
              const isTeen = (tool.badge || '').includes('13+');
              const isPlanned = plannedTool === tool.name;
              return (
                <button
                  key={tool.name}
                  type="button"
                  onClick={() => toggle(tool.name)}
                  aria-expanded={isOpen}
                  aria-controls={panelId}
                  className={`gift-btn flex flex-col items-center text-center gap-1.5 px-1.5 pt-5 pb-2.5 rounded-2xl ${isOpen ? palette.btnOpen : 'hover:bg-slate-50'}`}
                >

    function getGiftTools(mod, side, grade) {
      const tier = (side === 'this' ? mod.thisTech : mod.thatTech).gradeTiers[grade];
      const tools = (tier && tier.tools) || [];
      const plan = (giftPlan[mod.id] && giftPlan[mod.id][grade] && giftPlan[mod.id][grade][side]) || [];
      const merged = tools.map((tool, i) => {
        const p = plan.find(x => x.name === tool.name) || {};
        return { ...tool, ...p, slot: p.slot || (i < 2 ? i + 1 : 'stuffer') };
      });
      return {
        gifts: merged.filter(t => t.slot !== 'stuffer').sort((a, b) => a.slot - b.slot),
        stuffers: merged.filter(t => t.slot === 'stuffer')
      };
    }

          const code = (err && err.code) || '';

          ? Boolean(r.digitalCustom && r.digitalCustom.trim())

          let nextThis = cur.thisCount;
          let nextThat = cur.thatCount;

          if (cur.userVote === chosenSide) return prev;

          if (cur.userVote === 'this' && chosenSide === 'that') {
            nextThis = Math.max(0, nextThis - 1);
            nextThat += 1;
          } else if (cur.userVote === 'that' && chosenSide === 'this') {
            nextThat = Math.max(0, nextThat - 1);
            nextThis += 1;
          } else if (!cur.userVote) {
            if (chosenSide === 'this') nextThis += 1;
            if (chosenSide === 'that') nextThat += 1;
          }

          const updated = {
            ...prev,
            [modId]: { thisCount: nextThis, thatCount: nextThat, userVote: chosenSide }
          };

          try {
            localStorage.setItem('remc12e_tth_tinsel_votes', JSON.stringify(updated));

            <div className="border-b-2 border-slate-900 pb-4 mb-6">
              <div className="flex items-center justify-between">
                <div>
                  <h1 className="text-2xl font-black text-slate-900">Tech the Halls: This or That!</h1>
                  <p className="text-xs text-slate-600 font-bold mt-0.5">REMC 12E Professional Learning • Branch ISD | Calhoun ISD</p>
                </div>
                {participantInfo.name && (
                  <div className="text-right text-xs">
                    <div className="font-black text-slate-900">{participantInfo.name}</div>
                    <div className="text-slate-500">PIC: {participantInfo.picNumber || 'N/A'} • {participantInfo.district || 'Branch/Calhoun'}</div>
                  </div>
                )}
              </div>
              <div className="text-[10px] text-slate-500 mt-2">
                Target Grade Band: {activeGrade === 'k2' ? 'K–2 Primary' : activeGrade === 'g38' ? '3–8 Intermediate' : '9–12 & Career Center (CTE)'} • Printed on {new Date().toLocaleDateString()}
              </div>
            </div>

            {(printScope === 'current' ? [currentModule] : modulesData).map((mod) => {
              if (!mod) return null;
              const thisSet = getGiftTools(mod, 'this', activeGrade);
              const thatSet = getGiftTools(mod, 'that', activeGrade);
              const allThis = [...thisSet.gifts, ...thisSet.stuffers];
              const allThat = [...thatSet.gifts, ...thatSet.stuffers];

              const filteredThis = printFilter === 'favorites' 
                ? allThis.filter(t => favoriteTools.includes(t.name))
                : allThis;

              const filteredThat = printFilter === 'favorites'
                ? allThat.filter(t => favoriteTools.includes(t.name))
                : allThat;

              const r = notes[mod.id];

              return (
                <div key={mod.id} className="mb-8 page-break-inside-avoid">
                  <div className="bg-slate-100 p-3 rounded-lg border border-slate-300 mb-3">
                    <h2 className="text-base font-black text-slate-900">{mod.theme.bakeryIcon} Module {mod.id}: {mod.title}</h2>
                    <p className="text-xs text-slate-600 italic mt-0.5">{mod.tagline} ({mod.theme.bakeryType})</p>
                  </div>

                  <div className="grid grid-cols-2 gap-4 mb-4">
                    <div>
                      <h3 className="text-xs font-black uppercase text-emerald-800 border-b border-emerald-300 pb-1 mb-2">
                        THIS: Digital Pixels ({filteredThis.length})
                      </h3>
                      <div className="space-y-2">
                        {filteredThis.length === 0 ? (
                          <div className="text-[11px] text-slate-400 italic">No tools bookmarked in this section.</div>
                        ) : (
                          filteredThis.map((tool, idx) => (
                            <div key={idx} className="border border-slate-200 p-2.5 rounded-lg bg-slate-50/50">
                              <div className="text-xs font-black text-slate-900 flex items-center justify-between">
                                <span>{tool.name}</span>
                                {favoriteTools.includes(tool.name) && <span className="text-[10px] text-amber-600">⭐ Favorited</span>}
                              </div>
                              <div className="text-[10px] text-slate-600 font-semibold">{tool.need ? `${tool.need} • ` : ''}{tool.slot === 'stuffer' ? 'Stocking stuffer • ' : ''}{tool.badge}{show5E && (tool.phases || []).length > 0 ? ` • 5E: ${tool.phases.join(' & ')}` : ''}</div>
                              <p className="text-[11px] text-slate-700 mt-1 leading-snug">{tool.teaser || tool.whatItIs}</p>
                              {tool.prepTime && <p className="text-[11px] text-slate-800 mt-1 leading-snug"><strong>Prep ({tool.prepTime}):</strong> {tool.prepDetail}</p>}
                              {printIncludeTips && tool.inClass && <p className="text-[11px] text-slate-800 mt-1 leading-snug"><strong>In class:</strong> {tool.inClass}</p>}
                              {printIncludeTips && tool.tryIt && <p className="text-[11px] text-slate-800 mt-1 leading-snug"><strong>Try it:</strong> {tool.tryIt}</p>}
                            </div>
                          ))
                        )}
                      </div>
                    </div>

                    <div>
                      <h3 className="text-xs font-black uppercase text-red-800 border-b border-red-300 pb-1 mb-2">
                        THAT: Analog & Tactile ({filteredThat.length})
                      </h3>
                      <div className="space-y-2">
                        {filteredThat.length === 0 ? (
                          <div className="text-[11px] text-slate-400 italic">No tools bookmarked in this section.</div>
                        ) : (
                          filteredThat.map((tool, idx) => (
                            <div key={idx} className="border border-slate-200 p-2.5 rounded-lg bg-slate-50/50">
                              <div className="text-xs font-black text-slate-900 flex items-center justify-between">
                                <span>{tool.name}</span>
                                {favoriteTools.includes(tool.name) && <span className="text-[10px] text-amber-600">⭐ Favorited</span>}
                              </div>
                              <div className="text-[10px] text-slate-600 font-semibold">{tool.need ? `${tool.need} • ` : ''}{tool.slot === 'stuffer' ? 'Stocking stuffer • ' : ''}{tool.badge}{show5E && (tool.phases || []).length > 0 ? ` • 5E: ${tool.phases.join(' & ')}` : ''}</div>
                              <p className="text-[11px] text-slate-700 mt-1 leading-snug">{tool.teaser || tool.whatItIs}</p>
                              {tool.prepTime && <p className="text-[11px] text-slate-800 mt-1 leading-snug"><strong>Prep ({tool.prepTime}):</strong> {tool.prepDetail}</p>}
                              {printIncludeTips && tool.inClass && <p className="text-[11px] text-slate-800 mt-1 leading-snug"><strong>In class:</strong> {tool.inClass}</p>}
                              {printIncludeTips && tool.tryIt && <p className="text-[11px] text-slate-800 mt-1 leading-snug"><strong>Try it:</strong> {tool.tryIt}</p>}
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>


                  {printIncludeReflections && r && (
                    <div className="border-t border-dashed border-slate-300 pt-2 text-xs">
                      <span className="font-black text-slate-800 block text-[11px] uppercase mb-1">My 3-Part Micro-Reflection:</span>
                      <div className="grid grid-cols-2 gap-2 mb-1">
                        <div><strong>Digital Tool ("THIS"):</strong> {r.digital === 'Other' ? r.digitalCustom : r.digital || 'None'}</div>
                        <div><strong>Analog Strategy ("THAT"):</strong> {r.analog === 'Other' ? r.analogCustom : r.analog || 'None'}</div>
                      </div>
                      <div><strong>Why It Matters (Intentional Blend):</strong> <span className="italic">{r.why || 'None recorded'}</span></div>
                    </div>
                  )}
                </div>
              );
            })}

            <div className="text-center text-[10px] text-slate-400 border-t pt-3 mt-6">
              REMC 12E Lending Portal: https://remc12echeckout.myturn.com/library/?defaultPage=true • Generated via Tech the Halls: This or That!
            </div>
            </>)}
          </div>

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
