                        <span className="text-xs font-black uppercase tracking-widest text-amber-300">REMC 12E Verification</span>
                        <h2 className="text-2xl md:text-3xl font-black">SCECH Portfolio Turn-In</h2>
                      </div>
                    </div>
                    <p className="text-emerald-100 text-sm md:text-base leading-relaxed max-w-2xl mt-2 font-light">
                      To receive official state clock hours, complete your Michigan MOECS registration info, review your compiled notes from each module, and submit an integration artifact.
                    </p>
                  </section>

                  {submitSuccess && (
                    <section className="bg-emerald-50 border-4 border-emerald-500 rounded-3xl p-6 md:p-8 shadow-xl text-emerald-950">
                      <div className="flex items-start space-x-4">
                        <div className="bg-emerald-600 text-white p-3 rounded-2xl shadow-md shrink-0">
                          <Check className="w-8 h-8 stroke-[3]" />
                        </div>
                        <div>
                          <h3 className="text-2xl font-black text-emerald-900">Portfolio Successfully Transmitted!</h3>
                          <p className="text-sm text-emerald-800 mt-1 leading-relaxed">
                            Fantastic job, <strong>{participantInfo.name}</strong>! Your compiled reflections and integration artifact are logged in the REMC 12E system for SCECH review.
                          </p>
                          <div className="mt-3 bg-white p-3.5 rounded-xl border border-emerald-200 text-xs font-mono text-slate-700">
                            <strong>Verification Code:</strong> {submissionId}
                          </div>
                          <div className="mt-4 flex flex-wrap gap-3">
                            <button
                              onClick={() => window.print()}
                              className="px-4 py-2.5 bg-emerald-800 hover:bg-emerald-900 text-white rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 shadow"
                            >
                              <Download className="w-4 h-4" />
                              <span>Print / Save Confirmation</span>
                            </button>
                            <button
                              onClick={() => setSubmitSuccess(false)}
                              className="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-bold transition-all"
                            >
                              Edit Responses
                            </button>
                          </div>
                        </div>
                      </div>
                    </section>
                  )}

                  <form onSubmit={handleSubmitPortfolio} className="space-y-8">
                    {/* Demographics */}
                    <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border-2 border-slate-200">
                      <h3 className="text-lg font-black text-slate-900 mb-1 flex items-center">
                        <Building2 className="w-5 h-5 mr-2 text-emerald-600" />
                        1. MOECS SCECH Registration Information
                      </h3>
                      <p className="text-xs text-slate-500 mb-6">
                        Required for reporting your clock hours directly into the Michigan Online Educator Certification System.
                      </p>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Full Name *</label>
                          <input
                            type="text"
                            required
                            value={participantInfo.name}
                            onChange={(e) => setParticipantInfo({ ...participantInfo, name: e.target.value })}
                            placeholder="e.g., Sarah Johnson"
                            className="w-full p-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">School Email *</label>
                          <input
                            type="email"
                            required
                            value={participantInfo.email}
                            onChange={(e) => setParticipantInfo({ ...participantInfo, email: e.target.value })}
                            placeholder="sjohnson@calhounisd.org"
                            className="w-full p-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">School District / Center</label>
                          <input
                            type="text"
                            value={participantInfo.district}
                            onChange={(e) => setParticipantInfo({ ...participantInfo, district: e.target.value })}
                            placeholder="e.g., Calhoun Area Career Center (CACC)"
                            className="w-full p-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Michigan PIC Number *</label>
                          <input
                            type="text"
                            required
                            value={participantInfo.picNumber}
                            onChange={(e) => setParticipantInfo({ ...participantInfo, picNumber: e.target.value })}
                            placeholder="e.g., 123456"
                            className="w-full p-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono"
                          />
                        </div>
                      </div>
                    </div>

                    {/* Compiled Notes */}
                    <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border-2 border-slate-200">
                      <div className="flex items-center justify-between mb-4">
                        <div>
                          <h3 className="text-lg font-black text-slate-900 flex items-center">
                            <FileText className="w-5 h-5 mr-2 text-emerald-600" />
                            2. Compiled Module Notes
                          </h3>
                          <p className="text-xs text-slate-500">Your notes from each weekly module are automatically compiled here.</p>
                        </div>
                      </div>

                      <div className="space-y-4">
                        {modulesData.map(mod => (
                          <div key={mod.id} className="p-4 rounded-2xl bg-slate-50 border border-slate-200">
                            <div className="flex items-center justify-between mb-1.5">
                              <span className="text-xs font-bold text-slate-900">Module {mod.id}: {mod.title}</span>
                              <button
                                type="button"
                                onClick={() => handleSelectModule(String(mod.id))}
                                className="text-[11px] text-red-600 hover:underline font-bold"
                              >
                                Edit in Walkthrough
                              </button>
                            </div>
                            <textarea
                              rows={2}
                              value={notes[mod.id] || ''}
                              onChange={(e) => saveNotesLocally(mod.id, e.target.value)}
                              placeholder={`No notes recorded yet for Module ${mod.id}...`}
                              className="w-full p-2.5 rounded-xl border border-slate-200 bg-white text-xs text-slate-700 focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                            ></textarea>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Artifact */}
                    <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border-2 border-slate-200">
                      <div className="mb-4">
                        <h3 className="text-lg font-black text-slate-900 flex items-center">
                          <Sparkles className="w-5 h-5 mr-2 text-amber-500" />
                          3. Final Integration Artifact
                        </h3>
                        <p className="text-xs text-slate-500 mt-0.5">
                          Choose how you would like to showcase your synthesis of high-tech and low-tech strategies.
                        </p>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
                        {[
                          { id: 'link', label: 'Video / Drive URL', icon: Video, sub: 'Loom, YouTube, Drive' },
                          { id: 'lessonPlan', label: 'Lesson Plan Template', icon: FileText, sub: 'Built-in Form' },
                          { id: 'file', label: 'File Attachment', icon: UploadCloud, sub: 'PDF, Doc, Image' }
                        ].map(tab => {
                          const Icon = tab.icon;
                          const isSelected = capstoneData.submissionType === tab.id;
                          return (
                            <button
                              type="button"
                              key={tab.id}
                              onClick={() => setCapstoneData({ ...capstoneData, submissionType: tab.id })}
                              className={`p-3.5 rounded-2xl border-2 text-left transition-all ${
                                isSelected 
                                  ? 'border-emerald-600 bg-emerald-50/90 ring-1 ring-emerald-500' 
                                  : 'border-slate-200 bg-white hover:bg-slate-50'
                              }`}
                            >
                              <Icon className={`w-5 h-5 mb-1.5 ${isSelected ? 'text-emerald-700' : 'text-slate-400'}`} />
                              <div className={`text-xs font-black ${isSelected ? 'text-emerald-950' : 'text-slate-800'}`}>{tab.label}</div>
                              <div className="text-[10px] text-slate-500">{tab.sub}</div>
                            </button>
                          );
                        })}
                      </div>

                      {capstoneData.submissionType === 'link' && (
                        <div className="space-y-3 bg-slate-50 p-5 rounded-2xl border border-slate-200">
                          <label className="block text-xs font-bold text-slate-700">Video or Shared Document Link (Google Drive, Loom, YouTube)</label>
                          <input
                            type="url"
                            value={capstoneData.artifactUrl}
                            onChange={(e) => setCapstoneData({ ...capstoneData, artifactUrl: e.target.value })}
                            placeholder="https://drive.google.com/file/d/... or https://www.loom.com/share/..."
                            className="w-full p-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white"
                          />
                        </div>
                      )}

                      {capstoneData.submissionType === 'lessonPlan' && (
                        <div className="space-y-4 bg-slate-50 p-5 rounded-2xl border border-slate-200">
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                              <label className="block text-xs font-bold text-slate-700 mb-1">Lesson Title</label>
                              <input
                                type="text"
                                value={capstoneData.lessonTitle}
                                onChange={(e) => setCapstoneData({ ...capstoneData, lessonTitle: e.target.value })}
                                placeholder="e.g., Photosynthesis & Classroom Hydroponics"
                                className="w-full p-2.5 rounded-xl border border-slate-300 text-xs bg-white"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-bold text-slate-700 mb-1">Target Grade Band</label>
                              <select
                                value={capstoneData.lessonGrade}
                                onChange={(e) => setCapstoneData({ ...capstoneData, lessonGrade: e.target.value })}
                                className="w-full p-2.5 rounded-xl border border-slate-300 text-xs bg-white"
                              >
                                <option>Elementary (K-5)</option>
                                <option>Middle School (6-8)</option>
                                <option>High School (9-12)</option>
                                <option>Career Center / CTE Program</option>
                              </select>
                            </div>
                          </div>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                              <label className="block text-xs font-bold text-emerald-800 mb-1">High-Tech Element ("THIS")</label>
                              <input
                                type="text"
                                value={capstoneData.lessonHighTech}
                                onChange={(e) => setCapstoneData({ ...capstoneData, lessonHighTech: e.target.value })}
                                placeholder="e.g., Desmos Classroom or PhET Simulation"
                                className="w-full p-2.5 rounded-xl border border-slate-300 text-xs bg-white"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-bold text-red-800 mb-1">Low-Tech Element ("THAT")</label>
                              <input
                                type="text"
                                value={capstoneData.lessonLowTech}
                                onChange={(e) => setCapstoneData({ ...capstoneData, lessonLowTech: e.target.value })}
                                placeholder="e.g., Mystery Box or Butcher Paper Placemat"
                                className="w-full p-2.5 rounded-xl border border-slate-300 text-xs bg-white"
                              />
                            </div>
                          </div>

                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1">The Intentional Blend</label>
                            <textarea
                              rows={3}
                              value={capstoneData.lessonIntegrationPlan}
                              onChange={(e) => setCapstoneData({ ...capstoneData, lessonIntegrationPlan: e.target.value })}
                              placeholder="Explain how both tools work together to deepen student mastery..."
                              className="w-full p-2.5 rounded-xl border border-slate-300 text-xs bg-white"
                            ></textarea>
                          </div>
                        </div>
                      )}

                      {capstoneData.submissionType === 'file' && (
                        <div className="bg-slate-50 p-6 rounded-2xl border-2 border-dashed border-slate-300 text-center">
                          <UploadCloud className="w-10 h-10 text-emerald-600 mx-auto mb-2" />
                          <div className="text-xs font-bold text-slate-800 mb-1">Attach Your Lesson Plan Document</div>
                          <p className="text-[11px] text-slate-500 mb-4">Supported: PDF, DOCX, PNG, JPG (Max 5MB)</p>
                          <input 
                            type="file" 
                            id="fileInput" 
                            className="hidden" 
                            onChange={(e) => {
                              const f = e.target.files[0];
                              if (f) setCapstoneData(prev => ({ ...prev, fileAttachmentName: f.name }));
                            }}
                          />
                          <label 
                            htmlFor="fileInput"
                            className="cursor-pointer inline-flex items-center px-4 py-2 bg-emerald-800 text-white rounded-xl text-xs font-bold"
                          >
                            Browse Files
                          </label>
                          {capstoneData.fileAttachmentName && (
                            <div className="mt-3 text-xs text-emerald-800 font-bold">Attached: {capstoneData.fileAttachmentName}</div>
                          )}
                        </div>
                      )}
                    </div>

                    <div className="flex items-center justify-between p-6 bg-emerald-950 text-white rounded-3xl shadow-xl flex-wrap gap-4 border-2 border-amber-400">
                      <div>
                        <h4 className="font-black text-sm md:text-base text-amber-300 flex items-center space-x-1.5">
                          <Sparkles className="w-4 h-4" />
                          <span>Ready to Complete Your SCECHs?</span>
                        </h4>
                        <p className="text-xs text-emerald-200">
                          Submit your portfolio for review and entry into the MOECS state system.
                        </p>
                      </div>

                      <button
                        type="submit"
                        disabled={isSubmitting}
                        className="px-6 py-3.5 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 text-white rounded-2xl font-black text-sm transition-all shadow-xl flex items-center space-x-2 ring-2 ring-amber-300"
                      >
                        {isSubmitting ? (
                          <>
                            <Clock className="w-4 h-4 animate-spin" />
                            <span>Transmitting...</span>
                          </>
                        ) : (
                          <>
                            <Award className="w-4 h-4 text-amber-300" />
                            <span>Submit Portfolio for SCECH Credit</span>
                          </>
                        )}
                      </button>
                    </div>
                  </form>
                </div>
              )}

              {/* VIEW: FACILITATOR DASHBOARD */}
              {currentView === 'facilitator' && (
                <div className="max-w-5xl mx-auto space-y-6 pb-12">
                  <section className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border-2 border-slate-200 flex items-center justify-between flex-wrap gap-4">
                    <div>
                      <div className="inline-flex items-center space-x-1.5 bg-amber-100 text-amber-900 text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full mb-1">
                        <ShieldCheck className="w-3.5 h-3.5 text-amber-700" />
                        <span>Facilitator Dashboard</span>
                      </div>
                      <h2 className="text-2xl font-black text-slate-900">REMC 12E SCECH Submissions</h2>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Live compiled portfolio submissions from educators across Branch and Calhoun ISDs.
                      </p>
                    </div>

                    <button
                      onClick={exportToCSV}
                      className="px-4 py-2.5 bg-emerald-800 hover:bg-emerald-900 text-white rounded-xl text-xs font-black shadow flex items-center space-x-1.5"
                    >
                      <Download className="w-4 h-4" />
                      <span>Export to CSV for MOECS</span>
                    </button>
                  </section>

                  <div className="flex items-center justify-between flex-wrap gap-3">
                    <div className="relative flex-1 max-w-sm">
                      <Search className="w-4 h-4 absolute left-3 top-3 text-slate-400" />
                      <input
                        type="text"
                        value={facilitatorFilter}
                        onChange={(e) => setFacilitatorFilter(e.target.value)}
                        placeholder="Search by teacher name, district, or PIC..."
                        className="w-full pl-9 pr-3 py-2 bg-white rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                      />
                    </div>
                    <div className="text-xs font-bold text-slate-600 bg-white px-3.5 py-2 rounded-xl border border-slate-200">
                      Total Submissions: <span className="text-emerald-700 font-black">{submissionsList.length}</span>
                    </div>
                  </div>

                  {submissionsList.length === 0 ? (
                    <div className="bg-white rounded-3xl p-12 text-center border-2 border-slate-200">
                      <TreePine className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                      <h3 className="text-base font-bold text-slate-700">No Submissions Recorded Yet</h3>
                      <p className="text-xs text-slate-500 max-w-md mx-auto mt-1">
                        As teachers complete their reflections and capstone, submissions will populate here with instant CSV export for MOECS.
                      </p>
                    </div>
                  ) : (
                    <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs">
                          <thead className="bg-slate-50 border-b border-slate-200 text-slate-600 font-black uppercase tracking-wider text-[10px]">
                            <tr>
                              <th className="p-4">Educator & District</th>
                              <th className="p-4">Michigan PIC</th>
                              <th className="p-4">Submitted At</th>
                              <th className="p-4">Artifact Summary</th>
                              <th className="p-4 text-right">Actions</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 text-slate-700">
                            {submissionsList
                              .filter(s => {
                                const term = facilitatorFilter.toLowerCase();
                                return (
                                  (s.participantName || '').toLowerCase().includes(term) ||
                                  (s.district || '').toLowerCase().includes(term) ||
                                  (s.picNumber || '').toLowerCase().includes(term)
                                );
                              })
                              .map((sub) => (
                                <tr key={sub.id} className="hover:bg-slate-50/80">
                                  <td className="p-4">
                                    <div className="font-bold text-slate-900">{sub.participantName}</div>
                                    <div className="text-[11px] text-slate-500">{sub.participantEmail}</div>
                                    <div className="text-[10px] text-emerald-700 font-medium">{sub.district}</div>
                                  </td>
                                  <td className="p-4 font-mono font-bold text-slate-700">{sub.picNumber}</td>
                                  <td className="p-4 text-slate-500 text-[11px]">{sub.dateString || 'Recently'}</td>
                                  <td className="p-4">
                                    {sub.capstone?.artifactUrl ? (
                                      <a href={sub.capstone.artifactUrl} target="_blank" rel="noreferrer" className="text-emerald-700 underline font-semibold">
                                        View Link/Video
                                      </a>
                                    ) : sub.capstone?.lessonTitle ? (
                                      <div className="font-semibold text-slate-800">{sub.capstone.lessonTitle}</div>
                                    ) : (
                                      <span className="text-slate-400">Attached File</span>
                                    )}
                                  </td>
                                  <td className="p-4 text-right">
                                    <button
                                      onClick={() => setSelectedSubmission(sub)}
                                      className="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 rounded-lg font-bold text-[11px] border border-emerald-200"
                                    >
                                      Review Work
                                    </button>
                                  </td>
                                </tr>
                              ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {selectedSubmission && (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                      <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 md:p-8 shadow-2xl space-y-6">
                        <div className="flex items-start justify-between border-b pb-4">
                          <div>
                            <span className="text-[10px] uppercase font-black text-emerald-700 tracking-wider">SCECH Audit Detail</span>
                            <h3 className="text-xl font-black text-slate-900">{selectedSubmission.participantName}</h3>
                            <p className="text-xs text-slate-500">
                              {selectedSubmission.district} • PIC: <span className="font-mono font-bold text-slate-800">{selectedSubmission.picNumber}</span>
                            </p>
                          </div>
                          <button onClick={() => setSelectedSubmission(null)} className="p-1.5 rounded-full hover:bg-slate-100">
                            <X className="w-5 h-5 text-slate-400" />
                          </button>
                        </div>

                        <div className="space-y-3">
                          <h4 className="text-xs font-black uppercase tracking-wider text-slate-400">Weekly Module Reflections</h4>
                          {[1, 2, 3, 4].map(idx => (
                            <div key={idx} className="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                              <div className="font-bold text-xs text-slate-800 mb-1">Module {idx} Response:</div>
                              <p className="text-xs text-slate-600 whitespace-pre-wrap leading-relaxed">
                                {selectedSubmission.moduleReflections?.[`module${idx}`] || 'No response recorded.'}
                              </p>
                            </div>
                          ))}
                        </div>

                        <div className="flex justify-end pt-2 border-t">
                          <button
                            onClick={() => setSelectedSubmission(null)}
                            className="px-5 py-2 bg-emerald-800 text-white rounded-xl text-xs font-bold shadow"
                          >
                            Close Review
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                </div>
              )}

            </main>
          </div>

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
