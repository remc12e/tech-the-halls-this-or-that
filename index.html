                        <button onClick={() => setModuleStep(2)} className="px-6 py-3 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 text-white rounded-2xl text-xs font-black shadow-md flex items-center space-x-2"><span>Step 3: The Research</span><ChevronRight className="w-4 h-4" /></button>
                      </div>
                    </div>
                  )}

                  {moduleStep === 2 && (
                    <div className="space-y-6">
                      <div className="bg-slate-900 text-white rounded-3xl p-6 md:p-8 shadow-xl border-2 border-slate-700">
                        <div className="flex items-center space-x-3 mb-3">
                          <div className="bg-emerald-500/20 p-2 rounded-xl text-emerald-400"><BookOpen className="w-6 h-6" /></div>
                          <div><span className="text-[10px] font-black uppercase tracking-widest text-emerald-400">Cognitive Science</span><h3 className="text-xl md:text-2xl font-black text-white">{currentModule.research.headline}</h3></div>
                        </div>
                        <p className="text-slate-300 text-sm md:text-base leading-relaxed mb-6 font-light">{currentModule.research.body}</p>
                        <div className="bg-slate-800/90 rounded-2xl p-4 border border-slate-700 flex items-start space-x-3">
                          <Sparkles className="w-5 h-5 text-amber-400 shrink-0 mt-0.5" />
                          <div><div className="text-xs font-black uppercase tracking-wider text-amber-300">Takeaway</div><div className="text-sm text-slate-200 font-medium mt-0.5">{currentModule.research.takeaway}</div></div>
                        </div>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div className="bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-5">
                          <div className="font-black text-xs uppercase tracking-wider text-emerald-900 mb-2 flex items-center"><Monitor className="w-4 h-4 mr-1.5 text-emerald-700" />When Pixels Shine</div>
                          <ul className="space-y-2">{currentModule.thisTech.pros.map((item, idx) => <li key={idx} className="flex items-start text-xs text-emerald-950"><CheckCircle2 className="w-3.5 h-3.5 text-emerald-600 mr-2 shrink-0 mt-0.5" /><span>{item}</span></li>)}</ul>
                        </div>
                        <div className="bg-red-50 border-2 border-red-300 rounded-2xl p-5">
                          <div className="font-black text-xs uppercase tracking-wider text-red-900 mb-2 flex items-center"><PenTool className="w-4 h-4 mr-1.5 text-red-700" />When Paper Wins</div>
                          <ul className="space-y-2">{currentModule.thatTech.pros.map((item, idx) => <li key={idx} className="flex items-start text-xs text-red-950"><CheckCircle2 className="w-3.5 h-3.5 text-red-600 mr-2 shrink-0 mt-0.5" /><span>{item}</span></li>)}</ul>
                        </div>
                      </div>
                      <div className="flex items-center justify-between pt-4">
                        <button onClick={() => setModuleStep(1)} className="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5"><ChevronLeft className="w-4 h-4" /><span>Back</span></button>
                        <button onClick={() => setModuleStep(3)} className="px-6 py-3 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 text-white rounded-2xl text-xs font-black shadow-md flex items-center space-x-2"><span>Step 4: Recipes</span><ChevronRight className="w-4 h-4" /></button>
                      </div>
                    </div>
                  )}

                  {moduleStep === 3 && (
                    <div className="space-y-6">
                      <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border-2 border-slate-200">
                        <div className="flex items-center justify-between flex-wrap gap-4 mb-6">
                          <div><h3 className="text-xl font-black text-slate-900 flex items-center"><GraduationCap className="w-6 h-6 mr-2 text-emerald-600" />How to Blend Both</h3></div>
                          <div className="bg-slate-100 p-1.5 rounded-2xl flex space-x-1 border border-slate-200">
                            {[{ id: 'k2', label: 'Primary (K–2)' }, { id: 'g38', label: 'Middle (3–8)' }, { id: 'h912', label: 'High & CTE (9–12)' }].map(tab => (
                              <button key={tab.id} onClick={() => setActiveGrade(tab.id)} className={`px-3.5 py-1.5 rounded-xl text-xs font-black transition-all ${activeGrade === tab.id ? 'bg-emerald-800 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>{tab.label}</button>
                            ))}
                          </div>
                        </div>
                        <div className="p-6 rounded-2xl bg-gradient-to-br from-emerald-50 via-teal-50/40 to-slate-50 border-2 border-emerald-200 text-slate-800 shadow-sm">
                          <div className="flex items-center space-x-2 text-emerald-900 font-black text-xs uppercase tracking-wider mb-2"><Sparkles className="w-4 h-4 text-amber-500" /><span>Featured Recipe: {activeGrade === 'k2' ? 'Grades K–2 (Primary)' : activeGrade === 'g38' ? 'Grades 3–8 (Middle)' : 'Grades 9–12 & CTE'}</span></div>
                          <p className="text-sm md:text-base text-slate-700 leading-relaxed font-normal">{activeGrade === 'k2' ? currentModule.classroom.k5 : activeGrade === 'g38' ? currentModule.classroom.m68 : currentModule.classroom.h912}</p>
                        </div>
                      </div>
                      <div className="flex items-center justify-between pt-4">
                        <button onClick={() => setModuleStep(2)} className="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5"><ChevronLeft className="w-4 h-4" /><span>Back</span></button>
                        <button onClick={() => setModuleStep(4)} className="px-6 py-3 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 text-white rounded-2xl text-xs font-black shadow-md flex items-center space-x-2"><span>Step 5: Reflection</span><ChevronRight className="w-4 h-4" /></button>
                      </div>
                    </div>
                  )}

                  {moduleStep === 4 && (
                    <div className="space-y-6">
                      <div className="bg-gradient-to-br from-amber-50 via-white to-emerald-50 rounded-3xl p-6 md:p-8 shadow-sm border-2 border-amber-300">
                        <div className="flex items-center justify-between flex-wrap gap-2 mb-3">
                          <div className="flex items-center space-x-2"><span className="bg-red-600 text-white text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full">SCECH Prompt</span><h3 className="text-lg font-black text-slate-900">Module {currentModule.id} Checkpoint</h3></div>
                          {notes[currentModule.id]?.trim() && <span className="text-xs font-bold text-emerald-700 flex items-center bg-emerald-100/70 px-3 py-1 rounded-full border border-emerald-300"><CheckCircle2 className="w-4 h-4 mr-1 text-emerald-600" /> Saved Locally</span>}
                        </div>
                        <p className="text-slate-800 text-sm md:text-base font-medium mb-4 bg-white/90 p-4 rounded-2xl border border-amber-200 leading-relaxed">{currentModule.reflectionPrompt}</p>
                        <textarea rows={5} value={notes[currentModule.id] || ''} onChange={(e) => saveNotesLocally(currentModule.id, e.target.value)} placeholder="Jot down your honest thoughts... (Your notes automatically flow into your final SCECH turn-in package)" className="w-full p-4 rounded-2xl border-2 border-slate-300 bg-white text-slate-800 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none resize-y"></textarea>
                        <div className="flex items-center justify-between flex-wrap gap-3 mt-4">
                          <div className="text-xs text-slate-500 font-bold">Word Count: {(notes[currentModule.id] || '').trim().split(/\s+/).filter(Boolean).length} words</div>
                          <div className="flex items-center space-x-3">
                            <button onClick={() => triggerToast(`Module ${currentModule.id} reflection saved!`)} className="px-4 py-2 bg-emerald-800 hover:bg-emerald-900 text-white rounded-xl text-xs font-bold shadow flex items-center space-x-1.5"><Save className="w-3.5 h-3.5" /><span>Save Note</span></button>
                            {currentModule.id < 4 ? (
                              <button onClick={() => { triggerToast(`Module ${currentModule.id} saved!`); handleSelectModule(String(currentModule.id + 1)); }} className="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-black shadow flex items-center space-x-1.5"><span>Next: Module {currentModule.id + 1}</span><ChevronRight className="w-4 h-4" /></button>
                            ) : (
                              <button onClick={() => { triggerToast("Opening SCECH Capstone."); setCurrentView('capstone'); }} className="px-5 py-2.5 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 text-emerald-950 rounded-xl text-xs font-black shadow flex items-center space-x-1.5"><span>Proceed to Capstone</span><Award className="w-4 h-4" /></button>
                            )}
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center justify-between pt-2">
                        <button onClick={() => setModuleStep(3)} className="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-bold flex items-center space-x-1.5"><ChevronLeft className="w-4 h-4" /><span>Back to Recipes</span></button>
                      </div>
                    </div>
                  )}

                </div>
              )}

              {/* CAPSTONE & FACILITATOR VIEWS REMAIN UNCHANGED FROM PREVIOUS CODE */}
              {currentView === 'capstone' && (
                <div className="max-w-4xl mx-auto space-y-8 pb-12">
                  <section className="bg-gradient-to-r from-emerald-950 via-emerald-900 to-emerald-950 text-white rounded-3xl p-6 md:p-8 shadow-xl border-4 border-amber-400">
                    <div className="flex items-center space-x-3 mb-2">
                      <div className="bg-amber-400 text-emerald-950 p-3 rounded-2xl font-black shadow-md"><Award className="w-7 h-7" /></div>
                      <div>
                        <span className="text-xs font-black uppercase tracking-widest text-amber-300">REMC 12E Verification</span>
                        <h2 className="text-2xl md:text-3xl font-black">SCECH Portfolio Turn-In</h2>
                      </div>
                    </div>
                    <p className="text-emerald-100 text-sm md:text-base leading-relaxed mt-2 font-light">
                      To receive official clock hours, complete your MOECS registration info, review your notes, and submit an integration artifact.
                    </p>
                  </section>

                  {submitSuccess && (
                    <section className="bg-emerald-50 border-4 border-emerald-500 rounded-3xl p-6 md:p-8 shadow-xl text-emerald-950">
                      <div className="flex items-start space-x-4">
                        <div className="bg-emerald-600 text-white p-3 rounded-2xl shadow-md shrink-0"><Check className="w-8 h-8 stroke-[3]" /></div>
                        <div>
                          <h3 className="text-2xl font-black text-emerald-900">Portfolio Successfully Transmitted!</h3>
                          <p className="text-sm text-emerald-800 mt-1">Fantastic job, <strong>{participantInfo.name}</strong>! Your reflections and artifact are logged for SCECH review.</p>
                          <div className="mt-3 bg-white p-3.5 rounded-xl border border-emerald-200 text-xs font-mono text-slate-700"><strong>Verification Code:</strong> {submissionId}</div>
                        </div>
                      </div>
                    </section>
                  )}

                  <form onSubmit={handleSubmitPortfolio} className="space-y-8">
                    <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border-2 border-slate-200">
                      <h3 className="text-lg font-black text-slate-900 mb-1 flex items-center"><Building2 className="w-5 h-5 mr-2 text-emerald-600" />1. Registration</h3>
                      <p className="text-xs text-slate-500 mb-6">Required for MOECS.</p>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label className="block text-xs font-bold text-slate-700 mb-1.5">Full Name *</label><input type="text" required value={participantInfo.name} onChange={(e) => setParticipantInfo({ ...participantInfo, name: e.target.value })} className="w-full p-3 rounded-xl border border-slate-300 text-sm" /></div>
                        <div><label className="block text-xs font-bold text-slate-700 mb-1.5">School Email *</label><input type="email" required value={participantInfo.email} onChange={(e) => setParticipantInfo({ ...participantInfo, email: e.target.value })} className="w-full p-3 rounded-xl border border-slate-300 text-sm" /></div>
                        <div><label className="block text-xs font-bold text-slate-700 mb-1.5">School District / Center</label><input type="text" value={participantInfo.district} onChange={(e) => setParticipantInfo({ ...participantInfo, district: e.target.value })} className="w-full p-3 rounded-xl border border-slate-300 text-sm" /></div>
                        <div><label className="block text-xs font-bold text-slate-700 mb-1.5">Michigan PIC Number *</label><input type="text" required value={participantInfo.picNumber} onChange={(e) => setParticipantInfo({ ...participantInfo, picNumber: e.target.value })} className="w-full p-3 rounded-xl border border-slate-300 text-sm font-mono" /></div>
                      </div>
                    </div>

                    <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border-2 border-slate-200">
                      <h3 className="text-lg font-black text-slate-900 mb-4 flex items-center"><FileText className="w-5 h-5 mr-2 text-emerald-600" />2. Compiled Module Notes</h3>
                      <div className="space-y-4">
                        {modulesData.map(mod => (
                          <div key={mod.id} className="p-4 rounded-2xl bg-slate-50 border border-slate-200">
                            <span className="text-xs font-bold text-slate-900 mb-1.5 block">Module {mod.id}: {mod.title}</span>
                            <textarea rows={2} value={notes[mod.id] || ''} onChange={(e) => saveNotesLocally(mod.id, e.target.value)} className="w-full p-2.5 rounded-xl border border-slate-200 bg-white text-xs"></textarea>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border-2 border-slate-200">
                      <h3 className="text-lg font-black text-slate-900 mb-4 flex items-center"><Sparkles className="w-5 h-5 mr-2 text-amber-500" />3. Final Integration Artifact</h3>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
                        {[{ id: 'link', label: 'Video URL', icon: Video }, { id: 'lessonPlan', label: 'Lesson Template', icon: FileText }, { id: 'file', label: 'File Attachment', icon: UploadCloud }].map(tab => (
                          <button type="button" key={tab.id} onClick={() => setCapstoneData({ ...capstoneData, submissionType: tab.id })} className={`p-3.5 rounded-2xl border-2 text-left ${capstoneData.submissionType === tab.id ? 'border-emerald-600 bg-emerald-50' : 'border-slate-200'}`}>
                            <tab.icon className="w-5 h-5 mb-1.5 text-emerald-700" /><div className="text-xs font-black">{tab.label}</div>
                          </button>
                        ))}
                      </div>
                      
                      {capstoneData.submissionType === 'link' && (
                        <div className="space-y-3 bg-slate-50 p-5 rounded-2xl border border-slate-200">
                          <label className="block text-xs font-bold">Video or Shared Document Link</label>
                          <input type="url" value={capstoneData.artifactUrl} onChange={(e) => setCapstoneData({ ...capstoneData, artifactUrl: e.target.value })} className="w-full p-3 rounded-xl border border-slate-300 text-sm bg-white" />
                        </div>
                      )}
                      
                      {capstoneData.submissionType === 'lessonPlan' && (
                        <div className="space-y-4 bg-slate-50 p-5 rounded-2xl border border-slate-200">
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div><label className="block text-xs font-bold mb-1">Lesson Title</label><input type="text" value={capstoneData.lessonTitle} onChange={(e) => setCapstoneData({ ...capstoneData, lessonTitle: e.target.value })} className="w-full p-2.5 rounded-xl border border-slate-300 text-xs bg-white" /></div>
                            <div><label className="block text-xs font-bold mb-1">Grade</label><input type="text" value={capstoneData.lessonGrade} onChange={(e) => setCapstoneData({ ...capstoneData, lessonGrade: e.target.value })} className="w-full p-2.5 rounded-xl border border-slate-300 text-xs bg-white" /></div>
                          </div>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div><label className="block text-xs font-bold text-emerald-800 mb-1">High-Tech Element ("THIS")</label><input type="text" value={capstoneData.lessonHighTech} onChange={(e) => setCapstoneData({ ...capstoneData, lessonHighTech: e.target.value })} className="w-full p-2.5 rounded-xl border border-slate-300 text-xs bg-white" /></div>
                            <div><label className="block text-xs font-bold text-red-800 mb-1">Low-Tech Element ("THAT")</label><input type="text" value={capstoneData.lessonLowTech} onChange={(e) => setCapstoneData({ ...capstoneData, lessonLowTech: e.target.value })} className="w-full p-2.5 rounded-xl border border-slate-300 text-xs bg-white" /></div>
                          </div>
                          <div><label className="block text-xs font-bold mb-1">The Intentional Blend</label><textarea rows={3} value={capstoneData.lessonIntegrationPlan} onChange={(e) => setCapstoneData({ ...capstoneData, lessonIntegrationPlan: e.target.value })} className="w-full p-2.5 rounded-xl border border-slate-300 text-xs bg-white"></textarea></div>
                        </div>
                      )}

                      {capstoneData.submissionType === 'file' && (
                        <div className="bg-slate-50 p-6 rounded-2xl border-2 border-dashed border-slate-300 text-center">
                          <UploadCloud className="w-10 h-10 text-emerald-600 mx-auto mb-2" />
                          <div className="text-xs font-bold text-slate-800 mb-1">Attach Your Lesson Plan Document</div>
                          <input type="file" id="fileInput" className="hidden" onChange={(e) => { const f = e.target.files[0]; if (f) setCapstoneData(prev => ({ ...prev, fileAttachmentName: f.name })); }} />
                          <label htmlFor="fileInput" className="cursor-pointer inline-flex items-center px-4 py-2 bg-emerald-800 text-white rounded-xl text-xs font-bold">Browse Files</label>
                          {capstoneData.fileAttachmentName && <div className="mt-3 text-xs text-emerald-800 font-bold">Attached: {capstoneData.fileAttachmentName}</div>}
                        </div>
                      )}
                    </div>

                    <div className="flex items-center justify-between p-6 bg-emerald-950 text-white rounded-3xl shadow-xl border-2 border-amber-400">
                      <div><h4 className="font-black text-sm md:text-base text-amber-300">Ready to Complete Your SCECHs?</h4></div>
                      <button type="submit" disabled={isSubmitting} className="px-6 py-3.5 bg-gradient-to-r from-red-600 to-rose-600 text-white rounded-2xl font-black text-sm shadow-xl flex items-center space-x-2 ring-2 ring-amber-300">
                        {isSubmitting ? <span>Transmitting...</span> : <span>Submit Portfolio</span>}
                      </button>
                    </div>
                  </form>
                </div>
              )}

              {currentView === 'facilitator' && (
                <div className="max-w-5xl mx-auto space-y-6 pb-12">
                  <section className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border-2 border-slate-200 flex items-center justify-between">
                    <div><h2 className="text-2xl font-black text-slate-900">REMC 12E SCECH Submissions</h2></div>
                    <button onClick={exportToCSV} className="px-4 py-2.5 bg-emerald-800 text-white rounded-xl text-xs font-black shadow flex items-center space-x-1.5"><Download className="w-4 h-4" /><span>Export to CSV for MOECS</span></button>
                  </section>
                  <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 border-b border-slate-200 text-slate-600 font-black uppercase tracking-wider text-[10px]">
                        <tr><th className="p-4">Educator</th><th className="p-4">PIC</th><th className="p-4">Submitted At</th><th className="p-4">Artifact</th><th className="p-4 text-right">Actions</th></tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {submissionsList.map((sub) => (
                          <tr key={sub.id} className="hover:bg-slate-50/80">
                            <td className="p-4"><div className="font-bold text-slate-900">{sub.participantName}</div><div className="text-[10px] text-emerald-700 font-medium">{sub.district}</div></td>
                            <td className="p-4 font-mono font-bold text-slate-700">{sub.picNumber}</td>
                            <td className="p-4 text-slate-500">{sub.dateString || 'Recently'}</td>
                            <td className="p-4">{sub.capstone?.artifactUrl ? 'Link/Video' : sub.capstone?.lessonTitle ? 'Form' : 'File'}</td>
                            <td className="p-4 text-right"><button onClick={() => setSelectedSubmission(sub)} className="px-3 py-1.5 bg-emerald-50 text-emerald-800 rounded-lg font-bold text-[11px] border border-emerald-200">Review</button></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {selectedSubmission && (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                      <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-6">
                        <div className="flex items-start justify-between border-b pb-4">
                          <div><h3 className="text-xl font-black text-slate-900">{selectedSubmission.participantName}</h3><p className="text-xs text-slate-500">PIC: {selectedSubmission.picNumber}</p></div>
                          <button onClick={() => setSelectedSubmission(null)} className="p-1.5 rounded-full hover:bg-slate-100"><X className="w-5 h-5 text-slate-400" /></button>
                        </div>
                        <div className="space-y-3">
                          {[1, 2, 3, 4].map(idx => (
                            <div key={idx} className="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                              <div className="font-bold text-xs text-slate-800 mb-1">Module {idx}:</div>
                              <p className="text-xs text-slate-600 whitespace-pre-wrap">{selectedSubmission.moduleReflections?.[`module${idx}`] || 'None'}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
