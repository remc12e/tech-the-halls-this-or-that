    }

      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.18, 1.25) rotate(-3deg); }
      50% { transform: scale(1.28, 1.38) rotate(2deg); filter: drop-shadow(0 0 8px #34d399); }
      75% { transform: scale(1.12, 1.18) rotate(-1deg); }
    }
    @keyframes garlandShimmer {

      50% { filter: drop-shadow(0 0 8px #10b981) drop-shadow(0 0 10px #f43f5e); }
    }

    function App() {
      const [currentView, setCurrentView] = useState('1'); 
      const [moduleStep, setModuleStep] = useState(0);

      const [isPrintModalOpen, setIsPrintModalOpen] = useState(false);

      const initialReflections = {

      const [notes, setNotes] = useState(initialReflections);

      const [capstoneData, setCapstoneData] = useState({

      const [isSubmitting, setIsSubmitting] = useState(false);

      const [submissionsList, setSubmissionsList] = useState([]);

      const stepTitles = [
        { title: "Holiday Showdown", desc: "This or That?", icon: Gift },
        { title: "Research & Recipes", desc: "Evidence & Practice", icon: BookOpen },
        { title: "Your Reflection", desc: "SCECH Checkpoint", icon: CheckCircle2 }
      ];

      // Load saved state from Local Storage
      useEffect(() => {
        try {
          const savedNotes = localStorage.getItem('remc12e_tth_notes');
          if (savedNotes) {
            const parsed = JSON.parse(savedNotes);
            const normalized = { ...initialReflections };
            [1, 2, 3, 4].forEach(id => {
              if (parsed[id]) {
                if (typeof parsed[id] === 'string') {
                  normalized[id] = { digital: '', digitalCustom: '', analog: '', analogCustom: '', why: parsed[id] };
                } else {
                  normalized[id] = { ...normalized[id], ...parsed[id] };
                }
              }
            });
            setNotes(normalized);
          }
          const savedInfo = localStorage.getItem('remc12e_tth_info');
          if (savedInfo) setParticipantInfo(JSON.parse(savedInfo));
          const savedSubs = localStorage.getItem('remc12e_tth_submissions');
          if (savedSubs) setSubmissionsList(JSON.parse(savedSubs));
          const savedFavs = localStorage.getItem('remc12e_tth_favorites');
          if (savedFavs) setFavoriteTools(JSON.parse(savedFavs));
          const savedVotes = localStorage.getItem('remc12e_tth_tinsel_votes');
          if (savedVotes) setTinselVotes(JSON.parse(savedVotes));
        } catch (e) {
          console.log("Local storage initialized");
        }
      }, []);

      const isReflectionComplete = (modId) => {
        const r = notes[modId];
        if (!r) return false;
        if (typeof r === 'string') return r.trim().length > 0;
        const hasDigital = r.digital === 'Other' 
          ? Boolean(r.digitalCustom && r.digitalCustom.trim()) 
          : Boolean(r.digital && r.digital.trim());
        const hasAnalog = r.analog === 'Other' 
          ? Boolean(r.analogCustom && r.analogCustom.trim()) 
          : Boolean(r.analog && r.analog.trim());
        const hasWhy = Boolean(r.why && r.why.trim());
        return (hasDigital || hasAnalog) && hasWhy;
      };

      const formatReflectionSummary = (r) => {
        if (!r) return 'No reflection recorded';
        if (typeof r === 'string') return r;
        const d = r.digital === 'Other' ? (r.digitalCustom ? `Other: ${r.digitalCustom}` : 'Other') : (r.digital || 'Not specified');
        const a = r.analog === 'Other' ? (r.analogCustom ? `Other: ${r.analogCustom}` : 'Other') : (r.analog || 'Not specified');
        return `[THIS Digital]: ${d}\n[THAT Analog]: ${a}\n[Rationale]: ${r.why || 'None'}`;
      };

      const handleTinselVote = (modId, chosenSide) => {
        setTinselVotes(prev => {
          const cur = prev[modId] || { thisCount: 25, thatCount: 25, userVote: null };
          let nextThis = cur.thisCount;
          let nextThat = cur.thatCount;

          if (cur.userVote === chosenSide) return prev;

          if (cur.userVote === 'this' && chosenSide === 'that') {
            nextThis = Math.max(0, nextThis - 1);
            nextThat += 1;
          } else if (cur.userVote === 'that' && chosenSide === 'this') {
            nextThat = Math.max(0, nextThat - 1);
            nextThis += 1;
          } else if (!cur.userVote) {
            if (chosenSide === 'this') nextThis += 1;
            if (chosenSide === 'that') nextThat += 1;
          }

          const updated = {
            ...prev,
            [modId]: { thisCount: nextThis, thatCount: nextThat, userVote: chosenSide }
          };

          try {
            localStorage.setItem('remc12e_tth_tinsel_votes', JSON.stringify(updated));
          } catch(e) {}

          triggerToast(chosenSide === 'this' 
            ? "✨ Unwrapped THIS (Pixels)! Garland shifted." 
            : "🎄 Unwrapped THAT (Paper & Tactile)! Garland shifted."
          );

          return updated;
        });
      };

      const toggleFavoriteTool = (toolName) => {
        setFavoriteTools(prev => {
          const isFav = prev.includes(toolName);
          const next = isFav ? prev.filter(t => t !== toolName) : [...prev, toolName];
          try {
            localStorage.setItem('remc12e_tth_favorites', JSON.stringify(next));
          } catch(e) {}
          triggerToast(isFav ? `Removed ${toolName} from toolkit` : `⭐ Saved ${toolName} to your toolkit!`);
          return next;
        });
      };

      const handleSelectModule = (modIdStr) => {
        setCurrentView(modIdStr);
        setModuleStep(0);
      };

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const saveNotesLocally = (modId, val) => {
        const nextNotes = { ...notes, [modId]: val };
        setNotes(nextNotes);
        try {
          localStorage.setItem('remc12e_tth_notes', JSON.stringify(nextNotes));
        } catch(e) {}
      };

      const updateReflectionField = (modId, field, value) => {
        const currentRef = notes[modId] || { digital: '', digitalCustom: '', analog: '', analogCustom: '', why: '' };
        const updatedRef = { ...currentRef, [field]: value };
        saveNotesLocally(modId, updatedRef);
      };

      const getProgress = () => {
        let count = 0;
        if (isReflectionComplete(1)) count++;
        if (isReflectionComplete(2)) count++;
        if (isReflectionComplete(3)) count++;
        if (isReflectionComplete(4)) count++;
        if (capstoneData.artifactUrl?.trim() || capstoneData.lessonTitle?.trim() || capstoneData.fileAttachmentName) count++;
        return { count, total: 5, percentage: Math.round((count / 5) * 100) };
      };

      const handleSubmitPortfolio = (e) => {
        e.preventDefault();

        if (!participantInfo.name || !participantInfo.email || !participantInfo.picNumber) {
          triggerToast("Please provide your Full Name, Email, and Michigan PIC Number.");
          return;
        }

        setIsSubmitting(true);

        const newId = 'SCECH-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        const submissionPayload = {
          id: newId,
          participantName: participantInfo.name,
          participantEmail: participantInfo.email,
          district: participantInfo.district || 'Branch / Calhoun ISD',
          picNumber: participantInfo.picNumber,
          submittedAt: Date.now(),
          dateString: new Date().toLocaleDateString('en-US', { 
            year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
          }),
          moduleReflections: {
            module1: formatReflectionSummary(notes[1]),
            module2: formatReflectionSummary(notes[2]),
            module3: formatReflectionSummary(notes[3]),
            module4: formatReflectionSummary(notes[4])
          },
          capstone: { ...capstoneData },
          status: 'Submitted for SCECH Verification'
        };

        const updatedSubs = [submissionPayload, ...submissionsList];
        setSubmissionsList(updatedSubs);
        try {
          localStorage.setItem('remc12e_tth_submissions', JSON.stringify(updatedSubs));
          localStorage.setItem('remc12e_tth_info', JSON.stringify(participantInfo));
        } catch(err) {}

        setTimeout(() => {
          setIsSubmitting(false);
          setSubmissionId(newId);
          setSubmitSuccess(true);
          triggerToast("Portfolio transmitted to REMC 12E facilitator!");
        }, 500);
      };

      const exportToCSV = () => {
        if (submissionsList.length === 0) {
          triggerToast("No submissions recorded yet to export.");
          return;
        }

        const headers = ["PIC Number", "Name", "Email", "District", "Submission Date", "Artifact URL / Lesson", "Module 1", "Module 2", "Module 3", "Module 4"];
        const rows = submissionsList.map(s => [
          `"${s.picNumber || ''}"`,
          `"${s.participantName || ''}"`,
          `"${s.participantEmail || ''}"`,
          `"${s.district || ''}"`,
          `"${s.dateString || ''}"`,
          `"${s.capstone?.artifactUrl || s.capstone?.lessonTitle || ''}"`,
          `"${(s.moduleReflections?.module1 || '').replace(/"/g, '""')}"`,
          `"${(s.moduleReflections?.module2 || '').replace(/"/g, '""')}"`,
          `"${(s.moduleReflections?.module3 || '').replace(/"/g, '""')}"`,
          `"${(s.moduleReflections?.module4 || '').replace(/"/g, '""')}"`
        ]);

        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `REMC12E_SCECH_TechTheHalls_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const progress = getProgress();
      const currentModule = modulesData.find(m => m.id === parseInt(currentView)) || modulesData[0];
      const activeTheme = currentModule.theme;
      
      const defaultAnnasCorner = "You've explored the tools—now it's time to build your masterpiece! Your final artifact is where intentional integration comes to life.";

      const activeVoteData = tinselVotes[currentModule?.id || 1] || { thisCount: 25, thatCount: 25, userVote: null };
      const totalVotes = activeVoteData.thisCount + activeVoteData.thatCount;
      const thisPercent = totalVotes > 0 ? Math.round((activeVoteData.thisCount / totalVotes) * 100) : 50;
      const thatPercent = 100 - thisPercent;

        <div className="min-h-screen bg-slate-100 flex flex-col font-sans text-slate-800">

                  ) : (
                    <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs">
                          <thead className="bg-slate-50 border-b border-slate-200 text-slate-600 font-black uppercase tracking-wider text-[10px]">
                            <tr>
                              <th className="p-4">Educator & District</th>
                              <th className="p-4">Michigan PIC</th>
                              <th className="p-4">Submitted At</th>
                              <th className="p-4">Artifact Summary</th>
                              <th className="p-4 text-right">Actions</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 text-slate-700">
                            {submissionsList
                              .filter(s => {
                                const term = facilitatorFilter.toLowerCase();
                                return (
                                  (s.participantName || '').toLowerCase().includes(term) ||
                                  (s.district || '').toLowerCase().includes(term) ||
                                  (s.picNumber || '').toLowerCase().includes(term)
                                );
                              })
                              .map((sub) => (
                                <tr key={sub.id} className="hover:bg-slate-50/80">
                                  <td className="p-4">
                                    <div className="font-bold text-slate-900">{sub.participantName}</div>
                                    <div className="text-[11px] text-slate-500">{sub.participantEmail}</div>
                                    <div className="text-[10px] text-emerald-700 font-medium">{sub.district}</div>
                                  </td>
                                  <td className="p-4 font-mono font-bold text-slate-700">{sub.picNumber}</td>
                                  <td className="p-4 text-slate-500 text-[11px]">{sub.dateString || 'Recently'}</td>
                                  <td className="p-4">
                                    {sub.capstone?.artifactUrl ? (
                                      <a href={sub.capstone.artifactUrl} target="_blank" rel="noreferrer" className="text-emerald-700 underline font-semibold">
                                        View Link/Video
                                      </a>
                                    ) : sub.capstone?.lessonTitle ? (
                                      <div className="font-semibold text-slate-800">{sub.capstone.lessonTitle}</div>
                                    ) : (
                                      <span className="text-slate-400">Attached File</span>
                                    )}
                                  </td>
                                  <td className="p-4 text-right">
                                    <button
                                      onClick={() => setSelectedSubmission(sub)}
                                      className="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 rounded-lg font-bold text-[11px] border border-emerald-200"
                                    >
                                      Review Work
                                    </button>
                                  </td>
                                </tr>
                              ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {selectedSubmission && (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                      <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 md:p-8 shadow-2xl space-y-6">
                        <div className="flex items-start justify-between border-b pb-4">
                          <div>
                            <span className="text-[10px] uppercase font-black text-emerald-700 tracking-wider">SCECH Audit Detail</span>
                            <h3 className="text-xl font-black text-slate-900">{selectedSubmission.participantName}</h3>
                            <p className="text-xs text-slate-500">
                              {selectedSubmission.district} • PIC: <span className="font-mono font-bold text-slate-800">{selectedSubmission.picNumber}</span>
                            </p>
                          </div>
                          <button onClick={() => setSelectedSubmission(null)} className="p-1.5 rounded-full hover:bg-slate-100">
                            <X className="w-5 h-5 text-slate-400" />
                          </button>
                        </div>

                        <div className="space-y-3">
                          <h4 className="text-xs font-black uppercase tracking-wider text-slate-400">Weekly Module Micro-Reflections</h4>
                          {[1, 2, 3, 4].map(idx => (
                            <div key={idx} className="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                              <div className="font-bold text-xs text-slate-800 mb-1">Module {idx}:</div>
                              <p className="text-xs text-slate-700 whitespace-pre-wrap leading-relaxed font-sans">
                                {selectedSubmission.moduleReflections?.[`module${idx}`] || 'No response recorded.'}
                              </p>
                            </div>
                          ))}
                        </div>

                        <div className="flex justify-end pt-2 border-t">
                          <button
                            onClick={() => setSelectedSubmission(null)}
                            className="px-5 py-2 bg-emerald-800 text-white rounded-xl text-xs font-bold shadow"
                          >
                            Close Review
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                </div>
              )}

            </main>
          </div>

          {/* PRINT MODAL */}
          {isPrintModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl space-y-6 animate-in zoom-in-95 duration-200">
                <div className="flex items-start justify-between border-b pb-4">
                  <div className="flex items-center space-x-3">
                    <div className="w-10 h-10 rounded-2xl bg-emerald-100 text-emerald-800 flex items-center justify-center font-bold">
                      <Printer className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="text-lg font-black text-slate-900">Print Desk Reference</h3>
                      <p className="text-xs text-slate-500">Save as PDF or print a classroom binder sheet</p>
                    </div>
                  </div>
                  <button onClick={() => setIsPrintModalOpen(false)} className="p-1.5 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-700">
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-black uppercase tracking-wider text-slate-700 mb-2">
                      1. Which Modules to Include:
                    </label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setPrintScope('current')}
                        className={`p-3 rounded-xl border-2 text-xs font-bold text-left transition-all ${
                          printScope === 'current'
                            ? 'border-emerald-600 bg-emerald-50 text-emerald-950'
                            : 'border-slate-200 text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        Module {currentModule?.id || 1} Only
                      </button>
                      <button
                        type="button"
                        onClick={() => setPrintScope('all-modules')}
                        className={`p-3 rounded-xl border-2 text-xs font-bold text-left transition-all ${
                          printScope === 'all-modules'
                            ? 'border-emerald-600 bg-emerald-50 text-emerald-950'
                            : 'border-slate-200 text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        All 4 Modules
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-black uppercase tracking-wider text-slate-700 mb-2">
                      2. Tool Card Selection:
                    </label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setPrintFilter('all')}
                        className={`p-3 rounded-xl border-2 text-xs font-bold text-left transition-all ${
                          printFilter === 'all'
                            ? 'border-emerald-600 bg-emerald-50 text-emerald-950'
                            : 'border-slate-200 text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        All Tools & Strategies
                      </button>
                      <button
                        type="button"
                        onClick={() => setPrintFilter('favorites')}
                        className={`p-3 rounded-xl border-2 text-xs font-bold text-left transition-all ${
                          printFilter === 'favorites'
                            ? 'border-amber-500 bg-amber-50 text-amber-950'
                            : 'border-slate-200 text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        ⭐ Only Bookmarked ({favoriteTools.length})
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 border-t border-slate-100 space-y-2.5">
                    <label className="flex items-center space-x-2.5 text-xs text-slate-700 font-bold cursor-pointer">
                      <input
                        type="checkbox"
                        checked={printIncludeReflections}
                        onChange={(e) => setPrintIncludeReflections(e.target.checked)}
                        className="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4"
                      />
                      <span>Include My 3-Part Micro-Reflections</span>
                    </label>

                    <label className="flex items-center space-x-2.5 text-xs text-slate-700 font-bold cursor-pointer">
                      <input
                        type="checkbox"
                        checked={printIncludeTips}
                        onChange={(e) => setPrintIncludeTips(e.target.checked)}
                        className="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4"
                      />
                      <span>Include Anna's Pro Tips & Science Takeaways</span>
                    </label>
                  </div>
                </div>

                <div className="flex items-center justify-between pt-4 border-t border-slate-100">
                  <button
                    type="button"
                    onClick={() => setIsPrintModalOpen(false)}
                    className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setIsPrintModalOpen(false);
                      setTimeout(() => window.print(), 150);
                    }}
                    className="px-5 py-2.5 bg-emerald-800 hover:bg-emerald-900 text-white rounded-xl text-xs font-black shadow flex items-center space-x-1.5"
                  >
                    <Printer className="w-4 h-4" />
                    <span>Print / Save as PDF</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* PRINT TEMPLATE */}
          <div id="print-area" className="hidden">
            <div className="border-b-2 border-slate-900 pb-4 mb-6">
              <div className="flex items-center justify-between">
                <div>
                  <h1 className="text-2xl font-black text-slate-900">Tech the Halls: This or That!</h1>
                  <p className="text-xs text-slate-600 font-bold mt-0.5">REMC 12E Professional Learning • Branch ISD | Calhoun ISD</p>
                </div>
                {participantInfo.name && (
                  <div className="text-right text-xs">
                    <div className="font-black text-slate-900">{participantInfo.name}</div>
                    <div className="text-slate-500">PIC: {participantInfo.picNumber || 'N/A'} • {participantInfo.district || 'Branch/Calhoun'}</div>
                  </div>
                )}
              </div>
              <div className="text-[10px] text-slate-500 mt-2">
                Target Grade Band: {activeGrade === 'k2' ? 'K–2 Primary' : activeGrade === 'g38' ? '3–8 Intermediate' : '9–12 & Career Center (CTE)'} • Printed on {new Date().toLocaleDateString()}
              </div>
            </div>

            {(printScope === 'current' ? [currentModule] : modulesData).map((mod) => {
              if (!mod) return null;
              const allThis = mod.thisTech.gradeTiers[activeGrade]?.tools || [];
              const allThat = mod.thatTech.gradeTiers[activeGrade]?.tools || [];

              const filteredThis = printFilter === 'favorites' 
                ? allThis.filter(t => favoriteTools.includes(t.name))
                : allThis;

              const filteredThat = printFilter === 'favorites'
                ? allThat.filter(t => favoriteTools.includes(t.name))
                : allThat;

              const r = notes[mod.id];

              return (
                <div key={mod.id} className="mb-8 page-break-inside-avoid">
                  <div className="bg-slate-100 p-3 rounded-lg border border-slate-300 mb-3">
                    <h2 className="text-base font-black text-slate-900">{mod.theme.bakeryIcon} Module {mod.id}: {mod.title}</h2>
                    <p className="text-xs text-slate-600 italic mt-0.5">{mod.tagline} ({mod.theme.bakeryType})</p>
                  </div>

                  <div className="grid grid-cols-2 gap-4 mb-4">
                    <div>
                      <h3 className="text-xs font-black uppercase text-emerald-800 border-b border-emerald-300 pb-1 mb-2">
                        THIS: Digital Pixels ({filteredThis.length})
                      </h3>
                      <div className="space-y-2">
                        {filteredThis.length === 0 ? (
                          <div className="text-[11px] text-slate-400 italic">No tools bookmarked in this section.</div>
                        ) : (
                          filteredThis.map((tool, idx) => (
                            <div key={idx} className="border border-slate-200 p-2.5 rounded-lg bg-slate-50/50">
                              <div className="text-xs font-black text-slate-900 flex items-center justify-between">
                                <span>{tool.name}</span>
                                {favoriteTools.includes(tool.name) && <span className="text-[10px] text-amber-600">⭐ Favorited</span>}
                              </div>
                              <div className="text-[10px] text-slate-500 font-semibold">{tool.badge}</div>
                              <p className="text-[11px] text-slate-700 mt-1 leading-snug">{tool.teaser || tool.whatItIs}</p>
                            </div>
                          ))
                        )}
                      </div>
                    </div>

                    <div>
                      <h3 className="text-xs font-black uppercase text-red-800 border-b border-red-300 pb-1 mb-2">
                        THAT: Analog & Tactile ({filteredThat.length})
                      </h3>
                      <div className="space-y-2">
                        {filteredThat.length === 0 ? (
                          <div className="text-[11px] text-slate-400 italic">No tools bookmarked in this section.</div>
                        ) : (
                          filteredThat.map((tool, idx) => (
                            <div key={idx} className="border border-slate-200 p-2.5 rounded-lg bg-slate-50/50">
                              <div className="text-xs font-black text-slate-900 flex items-center justify-between">
                                <span>{tool.name}</span>
                                {favoriteTools.includes(tool.name) && <span className="text-[10px] text-amber-600">⭐ Favorited</span>}
                              </div>
                              <div className="text-[10px] text-slate-500 font-semibold">{tool.badge}</div>
                              <p className="text-[11px] text-slate-700 mt-1 leading-snug">{tool.teaser || tool.whatItIs}</p>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>

                  {printIncludeTips && (
                    <div className="bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-xs mb-3 space-y-1">
                      <div><strong>Anna's Pro Tip: </strong>{mod.thisTech.gradeTiers[activeGrade]?.coachTip}</div>
                    </div>
                  )}

                  {printIncludeReflections && r && (
                    <div className="border-t border-dashed border-slate-300 pt-2 text-xs">
                      <span className="font-black text-slate-800 block text-[11px] uppercase mb-1">My 3-Part Micro-Reflection:</span>
                      <div className="grid grid-cols-2 gap-2 mb-1">
                        <div><strong>Digital Tool ("THIS"):</strong> {r.digital === 'Other' ? r.digitalCustom : r.digital || 'None'}</div>
                        <div><strong>Analog Strategy ("THAT"):</strong> {r.analog === 'Other' ? r.analogCustom : r.analog || 'None'}</div>
                      </div>
                      <div><strong>Why It Matters (Intentional Blend):</strong> <span className="italic">{r.why || 'None recorded'}</span></div>
                    </div>
                  )}
                </div>
              );
            })}

            <div className="text-center text-[10px] text-slate-400 border-t pt-3 mt-6">
              REMC 12E Lending Portal: https://remc12echeckout.myturn.com/library/?defaultPage=true • Generated via Tech the Halls: This or That!
            </div>
          </div>

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
